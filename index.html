<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>My Financial Planner</title>
<meta name="theme-color" content="#00c2a8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: responsive shell (bottom tabs on phone, side rail on tablet/desktop); a pay-cycle hero beside an ordered, swipeable bill list. */
:root{
  --bg:#f2f5ff; --surface:#ffffff; --ink:#101936; --muted:#6a7291; --line:#e4e8f6;
  --teal:#00c2a8; --blue:#2f6bff; --good:#0e9f6e; --good-bg:#dcf8ec; --warn:#d97706; --warn-bg:#fff2d9;
  --bad:#e5382b; --bad-bg:#ffe6e3; --accent:#2f6bff; --accent-soft:#e6edff;
  --shadow:0 6px 20px rgba(32,52,120,.08);
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --display:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1126; --surface:#161d3a; --ink:#eef1ff; --muted:#97a0c4; --line:#262f55;
    --good:#4ade9a; --good-bg:#0f3a2c; --warn:#fbbf4d; --warn-bg:#3d2c0b;
    --bad:#ff8a7e; --bad-bg:#47201d; --accent:#7ea2ff; --accent-soft:#1d2a5c;
    --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1126; --surface:#161d3a; --ink:#eef1ff; --muted:#97a0c4; --line:#262f55;
  --good:#4ade9a; --good-bg:#0f3a2c; --warn:#fbbf4d; --warn-bg:#3d2c0b;
  --bad:#ff8a7e; --bad-bg:#47201d; --accent:#7ea2ff; --accent-soft:#1d2a5c;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.shell{min-height:100%;display:block}
.content{min-width:0;padding-bottom:96px}
header{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;max-width:1120px;margin:0 auto}
header h1{margin:0;font-family:var(--display);font-size:22px;font-weight:700;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.badge{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
main{padding:0 16px;display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1120px;margin:0 auto}
/* nav: bottom tabs on phones, side rail on wider screens */
.side{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.brand,.side-foot{display:none}
nav{display:flex}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;cursor:pointer;border-radius:14px}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
/* cycle view */
.cyc{display:flex;flex-direction:column;gap:16px}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cnav button{width:42px;height:42px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font-size:20px;cursor:pointer}
.cnav button:disabled{opacity:.35;cursor:default}
.cnav div{text-align:center}
.cnav b{font-family:var(--display);font-size:17px;display:block}
.cnav small{color:var(--muted);font-size:12px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#00c2a8 0%,#2f6bff 100%);box-shadow:0 12px 28px rgba(47,107,255,.28)}
.hero::before{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::after{content:"";position:absolute;left:-40px;bottom:-70px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero.bad{background:linear-gradient(135deg,#ff6a5b 0%,#ff9f43 100%);box-shadow:0 12px 28px rgba(255,106,91,.3)}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;opacity:.95}
.pill{background:rgba(255,255,255,.22);border-radius:99px;padding:3px 11px;font-weight:600;font-size:12px}
.hero-big{font-family:var(--display);font-size:38px;font-weight:700;margin:6px 0 10px;line-height:1.1}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s ease}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero-stats small{display:block;font-size:11.5px;opacity:.9}
.hero-stats b{font-family:var(--display);font-size:16px}
.hero-note{margin-top:12px;background:rgba(255,255,255,.2);border-radius:12px;padding:8px 11px;font-size:13px;font-weight:500}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px}
.sec-h h2{margin:0;font-family:var(--display);font-size:17px}
.sec-h span{color:var(--muted);font-size:12.5px}
.list{display:flex;flex-direction:column;gap:10px}
.rw{position:relative;border-radius:18px;overflow:hidden;background:#7f93f5}
.rbg{position:absolute;inset:0;display:flex;align-items:center;padding-left:18px;color:#fff;font-weight:600;font-size:14px;gap:8px;opacity:0;pointer-events:none}
.rw.swiping .rbg{opacity:1}
.rbg svg{width:20px;height:20px}
.rfg{position:relative;z-index:1;display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--surface);padding:10px 8px 10px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow);transition:transform .2s ease}
.rfg.drag{transition:none}
.rw.armed .rfg{box-shadow:none}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.2px}
.namebtn{all:unset;display:block;cursor:pointer;min-width:0}
.namebtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.namebtn strong{font-weight:600;display:block;overflow-wrap:anywhere}
.namebtn small{color:var(--muted);font-size:12px;display:block}
.namebtn small.late{color:var(--bad);font-weight:600}
.namebtn small.soon{color:var(--warn);font-weight:600}
.namebtn small.ok{color:var(--good);font-weight:600}
.namebtn small.more{color:var(--accent);font-weight:600}
.rcol{text-align:right}
.rcol b{display:block;font-family:var(--display);font-weight:600;font-size:16px}
.rcol small{font-size:11.5px;color:var(--muted)}
.rw.done .rfg{background:var(--bg);box-shadow:none}
.rw.done .rfg>*{filter:grayscale(1);opacity:.5}
.rw.done .namebtn strong,.rw.done .rcol b{text-decoration:line-through}
.acts{align-self:stretch;display:flex;gap:6px}
.chip{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:56px;border:0;border-radius:14px;padding:0 8px;font:inherit;font-size:13px;font-weight:600;line-height:1.15;cursor:pointer;white-space:nowrap;transition:transform .1s,background .15s,box-shadow .15s}
.chip:active{transform:scale(.95)}
.chip svg{width:0;height:0;opacity:0;transition:all .15s}
.chip.on svg{opacity:1;width:16px;height:16px}
.chip.full{background:#e6ebff;color:#4558c8}
.chip.part{background:#fde7f3;color:#bd4a8c}
.chip.full.on{background:linear-gradient(160deg,#93a8ff,#7084f3);color:#fff;box-shadow:0 4px 10px rgba(112,132,243,.35)}
.chip.part.on{background:linear-gradient(160deg,#f6a9d3,#c78cf3);color:#fff;box-shadow:0 4px 10px rgba(199,140,243,.35)}
@media(prefers-color-scheme:dark){.chip.full{background:rgba(112,132,243,.22);color:#b3c0ff}.chip.part{background:rgba(246,169,211,.18);color:#f7b7da}}
@media(min-width:600px){.chip{min-width:84px;font-size:14px}.acts{gap:8px}}
@media(max-width:599px){
  .rfg{gap:8px;padding:8px 8px 8px 10px;grid-template-columns:38px minmax(0,1fr) auto auto}
  .rfg .av{width:38px;height:38px;font-size:11px;border-radius:12px}
  .rcol b{font-size:15px}.rcol small{font-size:10.5px}
  .acts{gap:5px}
  .chip{min-width:0;width:46px;padding:0 2px;font-size:12px;white-space:normal;text-align:center;border-radius:12px}
}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.splitnote{color:#bd4a8c;font-weight:600}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:all .15s}
.tick svg{width:17px;height:17px}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.hint2{font-size:12.5px;color:var(--muted);text-align:center;padding:2px 8px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.cardsgrid{display:grid;grid-template-columns:1fr;gap:14px}
.cc-top{display:flex;gap:12px;align-items:center}
.cc-top h3{margin:0;font-family:var(--display);font-size:16px;flex:1}
.cc-top b.big{font-family:var(--display);font-size:19px}
.cc-meta{display:flex;gap:14px;margin-top:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.cc-meta b{color:var(--ink);font-weight:600}
.cc-note{margin-top:10px;padding:9px 11px;border-radius:12px;background:var(--accent-soft);font-size:13px;color:var(--accent)}
.cc-act{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#2f6bff,#5b8cff);color:#fff;box-shadow:0 6px 14px rgba(47,107,255,.25)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.itemrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.itemrow:first-child{border-top:0}
.itemrow .l{display:flex;align-items:center;gap:12px}
.itemrow small{display:block;color:var(--muted);font-size:12px}
.itemrow b.n{font-family:var(--display);font-weight:600}
.stepper{display:flex;align-items:center;gap:14px;margin:10px 0}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer}
.stepper b{font-family:var(--display);font-size:26px;min-width:30px;text-align:center}
table.plain{width:100%;border-collapse:collapse;font-size:14px}
.plain td{padding:9px 0;border-top:1px solid var(--line)}
.plain td:last-child{text-align:right;font-weight:600}
.note{color:var(--muted);font-size:13px;margin:4px 0 0}
/* summary table */
.tstats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tstats .card{padding:12px 14px}
.tstats small{display:block;color:var(--muted);font-size:12px}
.tstats b{font-family:var(--display);font-size:19px}
.tbl{overflow:auto;max-height:calc(100vh - 300px);min-height:300px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);max-width:100%}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:980px;width:100%}
.grid th,.grid td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.grid thead th{background:var(--bg);color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1;white-space:normal;line-height:1.2}
.grid th:first-child{position:sticky;left:0;text-align:left;background:var(--surface);z-index:2;border-right:1px solid var(--line);font-weight:600}
.grid thead th:first-child{background:var(--bg);z-index:3}
.grid tr.cur td{background:#d3f5ee;font-weight:600;color:var(--ink);border-bottom-color:#9fe3d6}
.grid tr.cur th:first-child{background:linear-gradient(135deg,#00c2a8,#2f6bff);color:#fff;font-weight:700}
.grid tr.nxt td{background:#ebe7ff;border-bottom-color:#cfc6ff}
.grid tr.nxt th:first-child{background:#8f7cf2;color:#fff;font-weight:700}
.grid tr.cur td.tint,.grid tr.nxt td.tint{background:var(--warn-bg);color:var(--warn)}
.grid tr.cur td.ovr,.grid tr.nxt td.ovr{background:#e6f0ff;color:#1f5eff}
.grid tr.cur td.rem.neg,.grid tr.nxt td.rem.neg{background:var(--bad-bg);color:var(--bad)}
@media(prefers-color-scheme:dark){.grid tr.cur td{background:rgba(0,194,168,.2)}.grid tr.nxt td{background:rgba(143,124,242,.22)}}
.grid tr.past td,.grid tr.past th{color:#a9b3c1;background:rgba(120,135,155,.08);font-weight:400}
.grid tr.past td.cellbtn{cursor:default}
.grid tr.past td.paid{opacity:.7}
.grid tr.past td.tint,.grid tr.past td.ovr,.grid tr.past td.rem.neg{background:rgba(120,135,155,.08);color:#a9b3c1;font-weight:400}
.grid td.paid{text-decoration:line-through;opacity:.5}
.grid td.tint{background:var(--warn-bg);color:var(--warn);font-weight:600;text-decoration:none}
.grid td.rem{font-weight:700}
.grid td.rem.neg{color:var(--bad);background:var(--bad-bg)}
.grid td.usedfor{color:var(--muted);text-align:left}
.grid td.cellbtn{cursor:pointer}
.grid td.ovr{background:#e6f0ff;color:#1f5eff;font-weight:600}
.grid td.cellbtn:hover{outline:2px solid var(--accent);outline-offset:-2px}
@media(prefers-color-scheme:dark){.grid td.ovr{background:#1b2a4a;color:#8fb4ff}}
.zrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.zrow .chk{display:flex;align-items:center;gap:8px;font-weight:600}
.zrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--warn-bg);border:1px solid var(--warn)}
.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry strong{display:block;font-weight:600}
.entry small{color:var(--muted);font-size:12px}
.fab{position:fixed;bottom:84px;right:16px;z-index:3;border:0;border-radius:99px;padding:14px 22px;font:inherit;font-family:var(--display);font-weight:600;background:linear-gradient(135deg,#00c2a8,#2f6bff);color:#fff;box-shadow:0 10px 24px rgba(47,107,255,.4);cursor:pointer}
/* sheets */
.overlay{position:fixed;inset:0;background:rgba(10,16,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.sheet h3{margin:0;font-family:var(--display);font-size:18px}
.sheet input[type=range]{width:100%;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;font:inherit;width:100%}
.two{display:flex;gap:10px}
.hint{font-size:12px;color:var(--muted);margin-top:-4px}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.check{border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}
.check.ok{background:var(--good-bg);color:var(--good)}
.check.bad{background:var(--bad-bg);color:var(--bad)}
.check.info{background:var(--warn-bg);color:var(--warn)}
.pv{border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.pv-h,.pv-r{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px;padding:7px 0;font-size:13px}
.pv-h{color:var(--muted);font-size:11px;font-weight:600}
.pv-r{border-top:1px solid var(--line)}
.pv-r span:not(:first-child),.pv-h span:not(:first-child){text-align:right}
.pv-r.ed{align-items:center}
.pv-in{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 8px;font:inherit;text-align:right}
.dl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.dl:first-child{border-top:0}
.dl strong{display:block;font-weight:600}
.dl small{color:var(--muted);font-size:12px}
.dl.total{font-weight:700}
.dl .x{border:1px solid var(--line);background:transparent;color:var(--bad);border-radius:8px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer;margin-left:8px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer}
.mnav button:disabled{opacity:.35;cursor:default}

.acct{display:flex;align-items:center;gap:8px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border-radius:99px;padding:6px 12px 6px 7px;font:inherit;font-size:12.5px;cursor:pointer;max-width:220px}
.acct .dotc{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.acct .ini{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#00c2a8,#2f6bff);color:#fff;font-size:12px;font-weight:600;flex:none}
.acct span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct.s-synced .dotc,.acct.s-saving .dotc{background:var(--good)}
.acct.s-loading .dotc,.acct.s-checking .dotc{background:var(--accent)}
.acct.s-out .dotc,.acct.s-slow .dotc{background:var(--warn)}
.acct.s-error .dotc{background:var(--bad)}
.acct.s-conflict .dotc{background:var(--warn)}
.gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gate .box{width:100%;max-width:420px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate .logo{width:76px;height:76px;margin:0 auto;filter:drop-shadow(0 8px 16px rgba(47,107,255,.25))}
.gate h2{margin:0;font-family:var(--display);font-size:22px;text-wrap:balance}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate ol{text-align:left;margin:0;padding-left:20px;color:var(--ink);font-size:14px;display:flex;flex-direction:column;gap:4px}
.sal-tool{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:var(--accent-soft)}
.sal-grid{display:grid;grid-template-columns:1fr 112px 96px;gap:8px 10px;align-items:center;margin-top:6px}
.sal-grid .h{font-size:11px;color:var(--muted);font-weight:600}
.sal-grid .h:not(:first-child){text-align:right}
.sal-grid small{display:block;color:var(--muted);font-size:11.5px}
.gnone{text-align:center;color:var(--muted)}
.sal-in{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 9px;font:inherit;text-align:right}
.sal-grid .cur{font-weight:700;color:var(--accent)}

function statusOf(paid,due){
  if(paid)return {t:'จ่ายแล้ว',c:'ok'};
  const diff=Math.round((due-TODAY)/864e5);
  if(diff>0)return {t:'อีก '+diff+' วัน',c:diff<=5?'soon':''};
  if(diff===0)return {t:'ครบกำหนดวันนี้',c:'soon'};
  return {t:'เลยกำหนด '+(-diff)+' วัน',c:'late'};
}
const splitEntry=(col,mi)=>s.entries.find(e=>e.kind==='split'&&e.col===col&&(e.amounts[mi]||0)<0);
const splitOut=(col,mi)=>s.entries.filter(e=>e.kind==='split'&&e.col===col).reduce((t,e)=>t+((e.amounts[mi]||0)<0?-e.amounts[mi]:0),0);

function cycleItems(mi){
  const sal=salOf(mi)+carryOf(mi);
  const list=COLS.filter(c=>cell(c.id,mi)>0||splitOut(c.id,mi)>0).map(c=>({c,amt:cell(c.id,mi),due:dueDate(c,mi),paid:!!s.paid[mi+'-'+c.id],out:splitOut(c.id,mi)}));
  list.sort((a,b)=>a.due-b.due||a.c.name.localeCompare(b.c.name));
  let run=sal;
  list.forEach(x=>{run-=x.amt;x.after=run});
  return list;
}

/* ---------- charts ---------- */
const srN=()=>s.sr==null?12:s.sr;
function catOfCol(c,i){
  const m={},v=cell(c.id,i);let used=0;
  s.entries.forEach(e=>{if(e.col!==c.id||e.kind!=='add'||!e.cat)return;const a=e.amounts[i]||0;if(a){const k=e.cat.indexOf('x:')===0?'':e.cat;m[k]=(m[k]||0)+a;used+=a}});
  const rest=v-used;if(rest){const k=c.cat||'';m[k]=(m[k]||0)+rest}
  return m;
}
function catOf(i){
  const m={};
  COLS.forEach(c=>{const x=catOfCol(c,i);Object.keys(x).forEach(k=>{m[k]=(m[k]||0)+x[k]})});
  return m;
}
function segHtml(){
  const v=s.tv||'tbl';
  return '<div class="seg" role="tablist"><button data-act="tv" data-v="tbl"'+(v==='tbl'?' aria-current="true"':'')+'>▦ ตาราง</button><button data-act="tv" data-v="chart"'+(v==='chart'?' aria-current="true"':'')+'>📊 กราฟสรุป</button></div>';
}
function barSvg(cols,opt){
  /* cols: [{lab,v,cur,tip}] single-colour comparison bars; opt.line = income array */
  const bw=opt.bw,H=214,pl=36,pt=20,pb=28,W=pl+cols.length*bw+10,ph=H-pt-pb;
  const mx=Math.max(1000,...cols.map(c=>c.v),...(opt.line||[0]))*1.1,y=v=>pt+ph-(v/mx)*ph;
  let g='';
  for(let t=0;t<=4;t++){const v=mx*t/4;g+='<line x1="'+pl+'" x2="'+(W-4)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-5)+'" y="'+(y(v)+3.5)+'" text-anchor="end" class="ax">'+fmtK(v)+'</text>'}
  let bars='';
  cols.forEach((c,j)=>{
    const x=pl+j*bw+(bw>34?8:4),w=bw-(bw>34?16:8),h0=Math.max(c.v>0?2:0,y(0)-y(c.v));
    if(c.v>0)bars+='<rect x="'+x+'" y="'+(y(0)-h0)+'" width="'+w+'" height="'+h0+'" rx="4" fill="'+(c.cur?'#6b8cff':'#b9c4ff')+'"><title>'+esc(c.tip||c.lab+' ฿'+fmt(c.v))+'</title></rect><text x="'+(x+w/2)+'" y="'+(y(0)-h0-5)+'" text-anchor="middle" class="vl">'+fmtK(c.v)+'</text>';
    bars+='<text x="'+(x+w/2)+'" y="'+(H-9)+'" text-anchor="middle" class="ax'+(c.cur?' cu':'')+'">'+c.lab+'</text>';
  });
  let line='';
  if(opt.line&&opt.line.some(v=>v>0)){
    line='<polyline points="'+opt.line.map((v,j)=>(pl+j*bw+bw/2)+','+y(v)).join(' ')+'" fill="none" stroke="var(--good)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>'+opt.line.map((v,j)=>'<circle cx="'+(pl+j*bw+bw/2)+'" cy="'+y(v)+'" r="3" fill="var(--good)"/>').join('');
  }
  return '<svg class="chsvg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.aria)+'">'+g+bars+line+'</svg>';
}
function viewStats(){
  const cu=cur(),sr=srN(),mode=sr<=1?sr:'m';
  const idx=[];
  if(sr<=1)idx.push(cu);else for(let i=cu;i<Math.min(MONTHS.length,cu+sr);i++)idx.push(i);
  const a=idx[0],b=idx[idx.length-1];
  const per=idx.map(i=>catOf(i));
  const ct={};per.forEach(m=>Object.keys(m).forEach(k=>{ct[k]=(ct[k]||0)+Math.max(0,m[k])}));
  const keys=Object.keys(ct).filter(k=>ct[k]>0).sort((x,y)=>x===''?1:y===''?-1:ct[y]-ct[x]);
  const sumAll=keys.reduce((t,k)=>t+ct[k],0);
  const OPT=[[-1,'รายวัน'],[1,'เดือน'],[3,'3 เดือน'],[6,'6 เดือน'],[12,'1 ปี']];

  if(!sumAll)return segHtml()+rng+'<div class="card empty"><div class="art">'+PIG+'</div><b>ยังไม่มียอดให้สรุป</b><p class="note">ลงรายการหรือใส่ยอดในตาราง แล้วกราฟจะขึ้นที่นี่</p></div>';
  // trend
  let trend,ttl,sub,legendLine=false,kp;
  const mtot=i=>Math.max(0,total(i));
  if(sr===-1){
    const days=[];for(let d=new Date(S0);d<=E0;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))days.push(d);
    const bk=days.map(d=>({d,v:0,names:[]}));

    trend=barSvg(bk.map((z,j)=>({lab:z.d.getDate()===1||j===0?z.d.getDate()+'/'+(z.d.getMonth()+1):String(z.d.getDate()),v:z.v,cur:same(z.d,TODAY),tip:z.d.getDate()+' '+MS[z.d.getMonth()]+' · '+(z.names.join(', ')||'ไม่มีบิล')})),{bw:30,aria:'ค่าใช้จ่ายรายวัน'});
    ttl='📅 ค่าใช้จ่ายรายวัน';sub='ยอดที่ครบกำหนดแต่ละวัน · แท่งเข้ม = วันนี้';
    const mxd=bk.reduce((p,q)=>q.v>p.v?q:p,bk[0]),tt=bk.reduce((t,z)=>t+z.v,0);
    kp=[['รวมรอบนี้','฿'+fmt(tt),''],['เฉลี่ย/วัน','฿'+fmt(tt/bk.length),''],['วันที่จ่ายหนักสุด',mxd.d.getDate()+' '+MS[mxd.d.getMonth()],'฿'+fmt(mxd.v)]];
  }else{
    const ti=sr===1?[cu-1,cu,cu+1].filter(i=>i>=0&&i<MONTHS.length):idx;
    trend=barSvg(ti.map(i=>({lab:lab(i),v:mtot(i),cur:i===cu})),{bw:48,line:sr===1?null:idx.map(i=>salOf(i)+carryOf(i)),aria:'แนวโน้มค่าใช้จ่ายรวมรายเดือน'});
    ttl='📈 แนวโน้มค่าใช้จ่ายรวมรายเดือน';sub=sr===1?'เทียบเดือนก่อน – เดือนนี้ – เดือนถัดไป':'เทียบยอดรวมแต่ละเดือน · แท่งเข้ม = เดือนปัจจุบัน';
    legendLine=sr!==1&&idx.some(i=>salOf(i)+carryOf(i)>0);
    const mt=idx.map(mtot),tot=mt.reduce((t,v)=>t+v,0);
    if(sr===1){
      const days=S0&&E0?Math.round((E0-S0)/864e5)+1:30;
      kp=[['รวมเดือนนี้','฿'+fmt(tot),''],['เฉลี่ย/วัน','฿'+fmt(tot/days),''],['เงินที่มีใช้','฿'+fmt(salOf(cu)+carryOf(cu)),'']];
    }else{const mj=mt.indexOf(Math.max(...mt));kp=[['รวมช่วงนี้','฿'+fmt(tot),''],['เฉลี่ย/เดือน','฿'+fmt(tot/idx.length),''],['เดือนที่หนักสุด',lab(idx[mj]),'฿'+fmt(mt[mj])]]}
  }
  const kpH='<div class="kpis">'+kp.map(x=>'<div class="kpi"><small>'+x[0]+'</small><b class="num">'+x[1]+'</b>'+(x[2]?'<em class="num">'+x[2]+'</em>':'')+'</div>').join('')+'</div>';

  // donut
  const R=54,C=2*Math.PI*R;let acc=0;

  const crow=keys.map(k=>'<div class="crow"><i style="background:'+catMeta(k).c+'"></i><span>'+catMeta(k).e+' '+esc(catMeta(k).n)+'</span><b class="num">฿'+fmt(ct[k])+'</b><small>'+Math.round(ct[k]/sumAll*100)+'%</small></div>').join('');

  const smax=st.length?st[0].v:1,sT=st.reduce((t,x)=>t+x.v,0);

  return segHtml()+rng+kpH
   +'<div class="card chcard"><div class="sec-h"><h2>'+ttl+'</h2><span>'+sub+'</span></div><div class="chscroll">'+trend+'</div>'+lg+'</div>'
   +'<div class="card chcard"><div class="sec-h"><h2>🍩 แยกตามประเภทค่าใช้จ่าย</h2></div><div class="donutwrap">'+donut+'<div class="clist">'+crow+'</div></div>'
   +(ct['']>0?'<p class="note" style="margin:8px 0 0">"ไม่จัดประเภท" คือยอดที่ไม่ได้อยู่ใน 7 หมวด รวมถึงรายการที่กรอกชื่อเอง กำหนดหมวดประจำให้บัตรได้ที่ ตั้งค่าบัตรและอื่นๆ > แก้ไข</p>':'')+'</div>'
   +'<div class="card chcard"><div class="sec-h"><h2>💳 แยกตามแหล่งจ่าย</h2></div><div class="srows">'+srow+'</div></div>';
}

/* outstanding debt per column: total still to pay, and an estimate to close today
   (future interest is dropped; interest on the current/overdue rounds is kept) */
function debtOf(c){
  const cu=cur();let tot=0,close=0;
  for(let i=cu;i<MONTHS.length;i++){
    if(s.paid[i+'-'+c.id])continue;
    const v=cell(c.id,i);if(!v)continue;
    tot+=v;let ei=0;
    s.entries.forEach(e=>{
      if(e.col!==c.id||!e.interest)return;
      const a=e.amounts[i]||0;if(a<=0)return;
      const pos=Object.values(e.amounts).reduce((q,x)=>q+(x>0?x:0),0);
      if(pos>0)ei+=a*Math.min(1,e.interest/pos);
    });
    const o=origCell(c.id,i);
    if(isOver(c.id,i))ei=o>0?ei*v/o:0;
    close+=v-(i>cu?ei:0);
  }
  return {total:r2(tot),close:r2(Math.max(0,close))};
}
function debtHtml(){
  const rows=COLS.filter(c=>c.card).map(c=>({c,d:debtOf(c)})).filter(x=>x.d.total>0);
  if(!rows.length)return '';
  const T=r2(rows.reduce((q,x)=>q+x.d.total,0)),C=r2(rows.reduce((q,x)=>q+x.d.close,0));
  return '<div class="sec-h"><h2>หนี้คงเหลือต่อบัตร</h2><span>ประมาณการ</span></div><div class="card debt">'
    +'<div class="drow dh"><span></span><b>หนี้รวมที่ต้องจ่าย</b><b>ปิดวันนี้</b></div>'
    +rows.map(x=>'<div class="drow"><span class="l">'+avatar(x.c)+'<span>'+esc(x.c.name)+'</span></span><b class="num">฿'+fmt(x.d.total)+'</b><b class="num cl">฿'+fmt(x.d.close)+'</b></div>').join('')
    +'<div class="drow dt"><span>รวมทุกบัตร</span><b class="num">฿'+fmt(T)+'</b><b class="num cl">฿'+fmt(C)+'</b></div>'
    +'<small class="note">หนี้รวม = ยอดที่ยังไม่ได้จ่ายทุกงวดจากรอบปัจจุบันเป็นต้นไป (รวมดอกเบี้ยตามแผน) · ปิดวันนี้ = ตัดดอกเบี้ยของงวดอนาคตออก ยอดจริงจากบัตรอาจต่างเล็กน้อย</small></div>';
}

/* ---------- cards & other items ---------- */
function nextCycle(c){
  if(!c.card){
    let due=new Date(TODAY.getFullYear(),TODAY.getMonth(),dayIn(TODAY.getFullYear(),TODAY.getMonth(),c.due));
    if(due<=TODAY){const m=TODAY.getMonth()+1;due=new Date(TODAY.getFullYear(),m,dayIn(TODAY.getFullYear(),m,c.due))}
    return {cut:null,due};
  }
  let cut=new Date(TODAY.getFullYear(),TODAY.getMonth(),c.cut);
  if(cut<TODAY)cut=new Date(cut.getFullYear(),cut.getMonth()+1,c.cut);
  const due=c.due>c.cut?new Date(cut.getFullYear(),cut.getMonth(),c.due):new Date(cut.getFullYear(),cut.getMonth()+1,c.due);
  return {cut,due};
}
/* which sheet row (pay cycle) holds a given due date */
function suggestFrom(colId){
  const c=COLS.find(x=>x.id===colId),d=nextCycle(c).due;
  let idx=cur();
  for(let i=MONTHS.length-1;i>=0;i--)if(sdN(i,s.n)<=d){idx=i;break}
  return Math.min(MONTHS.length-1,Math.max(cur(),idx));
}

/* ---------- plans ---------- */
const dd=(a,b)=>Math.max(0,Math.round((b-a)/864e5));
const parseD=t=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const cutOf=(c,y,m)=>{const b=new Date(y,m,1);return new Date(b.getFullYear(),b.getMonth(),dayIn(b.getFullYear(),b.getMonth(),c.cut))};
function cutBefore(c,date){const y=date.getFullYear(),m=date.getMonth();let d=cutOf(c,y,m);if(d>=date)d=cutOf(c,y,m-1);return d}
const dueAt=(c,i)=>dueDate(c,Math.max(0,Math.min(MONTHS.length-1,i)));
/* Interest the way Thai card issuers charge it (daily, on the full amount from the swipe date once the bill is not paid in full,
   then on the unpaid balance until the next statement). o: {A,tx,P0,pay,kk,rate,Pd:[due dates of the next kk bills]} */
function revolve(c,o){
  const r=o.rate/36500,R=Math.max(0,o.A-o.pay),kk=o.kk;
  const base=fl2(R/kk),first=r2(base+R-base*kk);
  const B=[R],P=[];let rem=R;
  for(let j=1;j<=kk;j++){const pj=j===1?first:base;P.push(pj);rem-=pj;B.push(rem)}
  const Pd=[o.P0].concat(o.Pd),S=[null];
  for(let j=1;j<=kk;j++)S.push(cutBefore(c,Pd[j]));
  const rows=[];let p1=0,p2=0;
  for(let j=1;j<=kk;j++){
    let it;
    if(j===1){p1=o.lines?o.lines.reduce((t,l)=>t+l.amt*r*dd(l.date,Pd[0]),0):o.A*r*dd(o.tx,Pd[0]);p2=B[0]*r*(dd(Pd[0],S[1])+1);it=p1+p2}
    else it=B[j-2]*r*dd(S[j-1],Pd[j-1])+B[j-1]*r*(dd(Pd[j-1],S[j])+1);
    rows.push({P:P[j-1],it:r2(it)});
  }
  const tail=r2(B[kk-1]*r*dd(S[kk],Pd[kk]));
  const lineInfo=o.lines?o.lines.map(l=>({amt:l.amt,days:dd(l.date,Pd[0]),it:r2(l.amt*r*dd(l.date,Pd[0]))})):null;
  return {rows,tail,p1:r2(p1),p2:r2(p2),R,d1:o.tx?dd(o.tx,Pd[0]):0,d2:dd(Pd[0],S[1])+1,lineInfo};
}
/* Cash card: effective (declining balance) daily interest from the withdrawal date, no grace period, no waiting for the statement date */
function cashRows(lines,Pd,total,rate){
  const r=rate/36500,k=Pd.length,base=fl2(total/k),first=r2(base+total-base*k),rows=[];
  let B=total;
  for(let j=1;j<=k;j++){
    const P=j===1?first:base;
    const it=j===1?lines.reduce((t,l)=>t+l.amt*r*dd(l.date,Pd[0]),0):B*r*dd(Pd[j-2],Pd[j-1]);
    rows.push({P,it:r2(it)});B-=P;
  }
  return rows;
}
function cashCarry(R,P0,Pd,rate){
  const r=rate/36500,k=Pd.length,base=fl2(R/k),first=r2(base+R-base*k),rows=[];
  let B=R,prev=P0;
  for(let j=1;j<=k;j++){const P=j===1?first:base;rows.push({P,it:r2(B*r*dd(prev,Pd[j-1]))});B-=P;prev=Pd[j-1]}
  return rows;
}
function cardPlan(f){
  const c=COLS.find(x=>x.id===f.col),A=Math.max(0,r2(f.amt||0)),k=f.to-f.from+1;
  if(!isStd(c)||!A||k<1)return null;
  const rate=cardRate(c),cash=cardType(c)==='cash',tx=parseD(f.tx)||TODAY;
  const z=f.zero?(f.zm>0?Math.min(k,f.zm):k):0;
  const base=fl2(A/k),first=r2(base+A-base*k);
  const rows=Array.from({length:k},(_,j)=>({P:j===0?first:base,it:0}));
  let tail=0,p1=0,p2=0,d1=0,d2=0;
  if(z>=k){}
  else if(cash){
    const Pd=[];for(let j=0;j<k;j++)Pd.push(dueAt(c,f.from+j));
    cashRows([{amt:A,date:tx}],Pd,A,rate).forEach((r,j)=>{rows[j].P=r.P;rows[j].it=j<z?0:r.it});
  }
  else if(k===1){}
  else{
    const Pd=[];for(let j=1;j<k;j++)Pd.push(dueAt(c,f.from+j));
    const o=revolve(c,{A,tx,P0:dueAt(c,f.from),pay:first,kk:k-1,rate,Pd});
    o.rows.forEach((r,j)=>{rows[j+1].it=(j+1<z)?0:r.it});
    tail=o.tail;p1=o.p1;p2=o.p2;d1=o.d1;d2=o.d2;
  }
  const tot=rows.reduce((t,r)=>t+r.it,0)+tail;
  return {rows,tail,interest:tot,k,z,p1,p2,d1,d2};
}
function dscOf(f,raw){
  const d=+f.dsc||0;if(d<=0||raw<=0)return 0;
  return Math.min(raw,r2(f.du==='baht'?d:raw*Math.min(100,d)/100));
}
function interestRaw(f){
  if(f.iu==='card'){const p=cardPlan(f);return p?p.interest:0}
  const k=f.to-f.from+1,A=f.amt||0,v=+f.int||0;
  if(f.iu==='baht')return r2(v);
  if(f.iu==='pct')return r2(A*v/100*k);
  /* % per year on the remaining balance, equal monthly payments */
  const i=v/100/12;
  if(!i||k<1)return 0;
  const pmt=A*i/(1-Math.pow(1+i,-k));
  return Math.max(0,r2(pmt*k-A));
}
function interestOf(f){const r=interestRaw(f);return r-dscOf(f,r)}
function planAdd(f){
  const A=Math.max(0,r2(f.amt||0)),k=f.to-f.from+1;
  if(!A||k<1)return {};
  const cp=f.iu==='card'?cardPlan(f):null;
  if(cp){
    const o={};
    const raw=cp.interest,ds=dscOf(f,raw),red=cp.rows.map(r=>raw>0?Math.min(r.it,r2(r.it*ds/raw)):0);
    let rest=ds-red.reduce((a,b)=>a+b,0),tail=cp.tail;
    if(rest>0&&tail>0){const x=Math.min(rest,tail);tail-=x;rest-=x}
    if(rest>0)for(let i=red.length-1;i>=0&&rest>0;i--){const x=Math.min(rest,cp.rows[i].it-red[i]);red[i]+=x;rest-=x}
    cp.rows.forEach((r,i)=>{const mi=f.from+i;o[mi]=(f.over&&f.over[mi]!==undefined)?f.over[mi]:r2(r.P+r.it-red[i])});
    const tm=f.to+1;
    if(tail>0&&tm<MONTHS.length)o[tm]=(f.over&&f.over[tm]!==undefined)?f.over[tm]:tail;
    return o;
  }
  const T=A+interestOf(f),base=fl2(T/k),first=r2(base+T-base*k),out={};
  for(let i=0;i<k;i++){
    const mi=f.from+i;
    out[mi]=(f.over&&f.over[mi]!==undefined)?f.over[mi]:(i===0?first:base);
  }
  return out;
}
function planSplit(f){
  const cu=cur(),A=cell(f.col,cu),k=f.k,base=fl2(A/k),first=r2(base+A-base*k),out={};
  out[cu]=first-A;
  for(let i=1;i<k&&cu+i<MONTHS.length;i++)out[cu+i]=base;
  return out;
}
const afterCls=a=>a<0?'num neg':'num';

    const plan=planSplit(f),idx=Object.keys(plan).map(Number).sort((a,b)=>a-b);
    let bad=0;

      return '<div class="pv-r"><span>'+lab(i)+'</span><span class="num">฿'+fmt(nc)+'</span><span class="'+afterCls(after)+'">'+(after<0?'-':'')+fmt(Math.abs(after))+'</span></div>';

function paintDerived(){
  const f=s.form;if(!f||f.kind!=='add')return;
  const plan=planAdd(f),idx=Object.keys(plan).map(Number);
  let bad=0,sum=0;
  idx.forEach(i=>{
    sum+=plan[i];
    const after=remaining(i)-plan[i],el=document.getElementById('pv-af-'+i);
    if(after<0)bad++;
    if(el){el.className=afterCls(after);el.textContent=(after<0?'-':'')+fmt(Math.abs(after))}
  });
  const A=r2(f.amt||0),sm=document.getElementById('pv-sum'),w=document.getElementById('pv-warn');
  if(sm)sm.textContent='รวมที่จะลง ฿'+fmt(sum)+' · ยอดสินค้า ฿'+fmt(A)+' · ดอกเบี้ย/ส่วนเพิ่ม ฿'+fmt(sum-A);
  if(w){w.className='check '+(bad?'bad':'ok');w.textContent=bad?'มี '+bad+' รอบที่เงินไม่พอ ลองขยายจำนวนเดือนหรือแก้ยอดเอง':'ทุกรอบที่เกี่ยวข้องยังเหลือเงิน'}
}

function splLinesOk(q,A){
  const L=q.lines||[],sum=L.reduce((t,l)=>t+(l.amt||0),0);
  if(L.some(l=>!(l.amt>0)||!parseD(l.date)))return {ok:false,msg:'ใส่ยอดและวันที่รูดของทุกรายการก่อน (ไม่เดาวันที่ให้ ดูจากใบแจ้งหนี้หรือแอพบัตร)'};
  if(sum!==A)return {ok:false,msg:'ยอดรวมรายการ ฿'+fmt(sum)+' ไม่เท่ากับยอดบิล ฿'+fmt(A)+(sum<A?' · ยังเหลือ ฿'+fmt(A-sum):' · เกิน ฿'+fmt(sum-A))};
  return {ok:true,lines:L.map(l=>({amt:l.amt,date:parseD(l.date)}))};
}
function splCalc(){
  const q=s.sp,c=COLS.find(x=>x.id===q.col),A=cell(q.col,q.mi),pay=Math.min(A,Math.max(0,q.pay)),R=A-pay;
  const maxK=Math.max(1,Math.min(6,MONTHS.length-2-q.mi)),k=Math.min(maxK,Math.max(1,q.k));
  const out={};out[q.mi]=-R;
  const base={A,pay,R,k,maxK,out};
  if(isStd(c)&&R>0){
    const P0=parseD(q.pd)||dueAt(c,q.mi),Pd=[];
    for(let j=1;j<=k;j++)Pd.push(dueAt(c,q.mi+j));
    if(cardType(c)==='cash'){
      const rows=cashCarry(R,P0,Pd,q.rate||0);
      rows.forEach((r,j)=>{out[q.mi+j+1]=r2(r.P+r.it)});
      const intr=rows.reduce((t,r)=>t+r.it,0),close=R+cashCarry(R,P0,[Pd[0]],q.rate||0)[0].it;
      return Object.assign(base,{intr,T:R+intr,card:true,cash:true,close});
    }
    const chk=splLinesOk(q,A);
    if(!chk.ok)return Object.assign(base,{intr:0,T:R,card:true,bad:chk.msg,out:{}});
    const o=revolve(c,{A,lines:chk.lines,P0,pay,kk:k,rate:q.rate||0,Pd});
    o.rows.forEach((r,j)=>{out[q.mi+j+1]=r2(r.P+r.it)});
    const tm=q.mi+k+1;if(o.tail>0&&tm<MONTHS.length)out[tm]=o.tail;
    const intr=o.rows.reduce((t,r)=>t+r.it,0)+o.tail;
    const o1=revolve(c,{A,lines:chk.lines,P0,pay,kk:1,rate:q.rate||0,Pd:[Pd[0]]});
    return Object.assign(base,{intr,T:R+intr,card:true,p1:o.p1,p2:o.p2,d2:o.d2,tail:o.tail,lineInfo:o.lineInfo,close:R+o1.rows[0].it});
  }
  const i=(q.rate||0)/1200;
  const intr=R<=0||!i?0:r2((k===1?R*i:(R*i/(1-Math.pow(1+i,-k)))*k-R));
  const T=R+intr,bs=fl2(T/k),first=r2(bs+T-bs*k);
  for(let j=1;j<=k;j++)out[q.mi+j]=j===1?first:bs;
  return Object.assign(base,{intr,T});
}

    const after=remaining(i)-c.out[i];
    return '<div class="pv-r"><span>'+lab(i)+'</span><span class="num">฿'+fmt(cell(q.col,i)+c.out[i])+'</span><span class="'+afterCls(after)+'">'+(after<0?'-':'')+fmt(Math.abs(after))+'</span></div>';
  }).join('');
  const bad=Object.keys(c.out).map(Number).filter(i=>i!==q.mi&&remaining(i)-c.out[i]<0).length;

  else if(c.cash)det='<div class="note" style="margin:0">ลดต้นลดดอก คิดรายวันจากเงินต้นคงค้างตั้งแต่วันจ่ายรอบนี้ ถึงวันครบกำหนดแต่ละงวด</div>';

   +'<div class="pv"><div class="pv-h"><span>รอบ</span><span>ยอดหลังแบ่ง</span><span>คงเหลือ</span></div>'+rows+'</div>'

   +(c.card?'<p class="note" style="margin:0">ตัวเลขนี้เป็นการประมาณ: ถือว่าเงินที่จ่ายตัดเงินต้น และจ่ายดอกเบี้ยตามบิล ลำดับตัดชำระจริงและวันเริ่มคิดดอกของ KTC อาจต่างกัน ตรวจสอบกับใบแจ้งหนี้ก่อนตัดสินใจ</p>':'');
}

function readForm(e){
  const f=s.form;if(!f)return;
  const id=e.target.id;
  if(f.kind==='split'){
    if(id==='k'){f.k=+e.target.value;document.getElementById('kv').textContent=f.k;refreshForm()}
    return;
  }
  if(id.indexOf('pv-in-')===0){
    f.over[+e.target.dataset.mi]=pnum(e.target.value);
    paintDerived();return;
  }
  const g=x=>document.getElementById(x);
  if(id==='f-col'&&g('f-col').value==='__new'){openNewCol(true);return}
  f.cat=g('f-cat').value;f.catx=g('f-catx').value;f.name=f.cat==='__x'?f.catx.trim():(f.cat?catMeta(f.cat).n:'');
  g('f-catx').style.display=f.cat==='__x'?'':'none';
  if(id==='f-cat'||id==='f-catx')return;
  f.amt=pnum(g('f-amt').value);
  f.int=parseFloat(g('f-int').value)||0;
  f.iu=g('f-iu').value;
  f.dsc=parseFloat(g('f-dsc').value)||0;f.du=g('f-du').value;
  f.zero=g('f-z').checked;f.zm=parseInt(g('f-zm').value,10)||0;f.tx=g('f-tx').value||fmtD(TODAY);
  if(id==='f-name')return;
  f.over={};
  if(id==='f-col'){
    const k=f.to-f.from+1;f.col=g('f-col').value;{const cc2=COLS.find(x=>x.id===f.col);f.iu=isStd(cc2)?'card':'yr';g('f-iu').value=f.iu;if(cc2&&cc2.card&&cardType(cc2)==='other'){f.int=cardRate(cc2);g('f-int').value=f.int||''}}f.from=suggestFrom(f.col);f.to=Math.min(MONTHS.length-1,f.from+k-1);
  }else if(id==='f-from'){
    f.from=+g('f-from').value;if(f.to<f.from)f.to=f.from;
  }else if(id==='f-to'){
    f.to=+g('f-to').value;if(f.to<f.from)f.to=f.from;
  }
  g('f-from').value=f.from;g('f-to').value=f.to;
  refreshForm();
}

    closeSheet(true);s.tab='table';render();toast('แบ่งจ่าย '+col.name+' เป็น '+ks+' เดือนแล้ว');return;

  if(!Object.keys(plan).length||!f.name.trim()){toast('เลือกรายการและใส่ยอดเงินก่อนครับ');return}

    label:col.name+' · ฿'+fmt(f.amt)+(intr?' + ดอกเบี้ย ฿'+fmt(intr):'')+' · '+lab(f.from)+(k>1?' – '+lab(f.to)+' ('+k+' เดือน)':'')});

/* ---------- edit / delete a card or item ---------- */
function planOfCol(c){
  const idx=[];for(let i=0;i<MONTHS.length;i++)if(baseOf(c.id,i)>0)idx.push(i);
  if(!idx.length)return {amt:'',from:cur(),to:Math.min(MONTHS.length-1,cur()+11)};
  const cnt={};idx.forEach(i=>{const v=baseOf(c.id,i);cnt[v]=(cnt[v]||0)+1});
  const amt=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  return {amt,from:idx[0],to:idx[idx.length-1]};
}
function planHtml(c){
  const p=planOfCol(c),opt=(v)=>MONTHS.map((m,i)=>'<option value="'+i+'"'+(i===v?' selected':'')+'>'+esc(lab(i))+'</option>').join('');
  return '<div class="field"><label for="ec-pm">ยอดผ่อนต่อเดือน (บาท)</label><input id="ec-pm" class="num" inputmode="decimal" value="'+p.amt+'" placeholder="0"></div>'
   +'<div class="two"><div class="field"><label for="ec-pf">เริ่มรอบ</label><select id="ec-pf">'+opt(p.from)+'</select></div>'
   +'<div class="field"><label for="ec-pt">ถึงรอบ</label><select id="ec-pt">'+opt(p.to)+'</select></div></div>'
   +'<div class="hint" id="ec-pn"></div>';
}
function planNote(){
  const a=pnum(document.getElementById('ec-pm').value),f=+document.getElementById('ec-pf').value,to=+document.getElementById('ec-pt').value,n=document.getElementById('ec-pn');
  if(!n)return;
  if(to<f){n.textContent='รอบสุดท้ายต้องไม่ก่อนรอบเริ่ม';return}
  n.textContent=(to-f+1)+' เดือน × ฿'+fmt(a)+' = ฿'+fmt(r2(a*(to-f+1)))+' · บันทึกแล้วจะแทนที่ยอดรายเดือนเดิมของรายการนี้ (ยอดที่แก้เองรายช่องจะถูกล้าง)';
}

function saveCol(){
  const c=COLS.find(x=>x.id===s.editcol);if(!c)return;
  const name=document.getElementById('ec-name').value.trim();
  if(!name){toast('ใส่ชื่อก่อนครับ');return}
  c.name=name;
  const due=Math.min(31,Math.max(1,parseInt(document.getElementById('ec-due').value,10)||c.due));
  c.due=due;c.day=due;{const ce=document.getElementById('ec-cat');if(ce)c.cat=ce.value}
  if(c.card){const ct=document.getElementById('ec-cut');if(ct)c.cut=Math.min(31,Math.max(1,parseInt(ct.value,10)||c.cut));
    const ty=document.getElementById('ec-type'),rt=document.getElementById('ec-rate');
    if(ty)c.ctype=ty.value;if(rt){const v=parseFloat(rt.value);c.rate=isNaN(v)?cardRate(c):Math.max(0,v)}}
  if(!c.card&&document.getElementById('ec-pm')){
    const a=pnum(document.getElementById('ec-pm').value),f=+document.getElementById('ec-pf').value,to=+document.getElementById('ec-pt').value;
    if(to<f){toast('รอบสุดท้ายต้องไม่ก่อนรอบเริ่ม');return}
    const p0=planOfCol(c);
    if(a!==p0.amt||f!==p0.from||to!==p0.to){
      for(let i=0;i<MONTHS.length;i++){
        const k=c.id+'-'+i;delete s.over[k];
        if(a>0&&i>=f&&i<=to)s.baseEdit[k]=a;else delete s.baseEdit[k];
      }
    }
  }
  closeSheet(true);render();toast('บันทึกแล้ว');
}
function delCol(){
  const id=s.editcol;if(!id)return;
  if(s.delArm!==id){s.delArm=id;const b=document.getElementById('delcol');if(b)b.textContent='กดอีกครั้งเพื่อยืนยันลบ (ยอดและรายการทั้งหมดของรายการนี้จะหายไป)';return}
  COLS=COLS.filter(c=>c.id!==id);
  s.entries=s.entries.filter(e=>e.col!==id);
  Object.keys(s.baseEdit).forEach(k=>{if(k.indexOf(id+'-')===0)delete s.baseEdit[k]});
  Object.keys(s.over).forEach(k=>{if(k.indexOf(id+'-')===0)delete s.over[k]});
  Object.keys(s.paid).forEach(k=>{if(k.slice(k.indexOf('-')+1)===id)delete s.paid[k]});
  closeSheet(true);render();toast('ลบแล้ว');
}

/* ---------- account & sync: Supabase (Google / email link) when configured, otherwise this device only ---------- */
const CFG=window.APP_CONFIG||{};
const LS_KEY='debt-planner:v2',LS_DEMO='debt-planner:local-ok';
const sb=(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const acct={status:'checking',name:'',email:'',time:null,err:''};
const sync={uid:null,t:null,busy:false,lh:'',cloud:null};
const LS_META='debt-planner:meta';
let meta={at:null,base:null,synced:null,auto:false,conflict:false,uid:null};
try{Object.assign(meta,JSON.parse(localStorage.getItem(LS_META)||'{}'))}catch(_){}
const saveMeta=()=>{try{localStorage.setItem(LS_META,JSON.stringify(meta))}catch(_){}};
const canon=o=>{if(Array.isArray(o))return '['+o.map(canon).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o)};
const hashOf=o=>{const t=canon(o);let x=5381;for(let i=0;i<t.length;i++)x=((x<<5)+x+t.charCodeAt(i))|0;return x+':'+t.length};
const fmtDT=v=>{const d=new Date(v);return isNaN(d)?'':d.getDate()+' '+MS[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' น.'};
function chipHtml(){
  const st=acct.status;
  const map={checking:'กำลังตรวจสอบ…',local:'บันทึกในเครื่องนี้',out:'ยังไม่ได้เข้าสู่ระบบ',loading:'กำลังโหลดข้อมูล…',slow:'เชื่อมต่อช้า',saving:'กำลังบันทึก…',synced:'ซิงก์แล้ว',error:'ซิงก์ไม่สำเร็จ',conflict:'ข้อมูลสองฝั่งต่างกัน แตะเพื่อเลือก'};
  const ini=acct.name?Array.from(acct.name)[0].toUpperCase():'';
  const lead=(st==='synced'||st==='saving')&&ini?'<span class="ini">'+esc(ini)+'</span>':'<i class="dotc"></i>';
  let text=map[st];
  if(st==='local')text=sb?'ในเครื่องนี้ · แตะเพื่อซิงก์':'บันทึกในเครื่องนี้';
  else if(st==='synced'&&sync.uid){const dirty=meta.base&&hashOf(persist())!==meta.base;text=esc(acct.name||'บัญชี')+' · '+(meta.synced?(dirty?'มีส่วนที่ยังไม่ซิงก์':'ซิงก์ '+fmtDT(meta.synced)):'ยังไม่ซิงก์')}
  return '<button class="acct s-'+st+'" id="acct" data-act="acct" aria-label="บัญชีและการซิงก์">'+lead+'<span class="t">'+text+'</span></button>';
}
function paintChip(){const el=document.getElementById('acct');if(el)el.outerHTML=chipHtml()}
function setAcct(st,err){acct.status=st;acct.err=err||'';paintChip();const a=document.getElementById('acct-body');if(a)a.innerHTML=acctInner()}
function persist(){
  return {v:2,start:START,n:s.n,sal:s.sal,carry:s.carry,paid:s.paid,entries:s.entries,baseEdit:s.baseEdit,over:s.over,cols:COLS,hol:s.hol||[]};
}
function applyData(d){
  if(!d||!Array.isArray(d.cols)||!Array.isArray(d.sal))return false;
  const pad=(a,fill)=>{const o=a.slice(0,NM);while(o.length<NM)o.push(fill===undefined?(o.length?o[o.length-1]:0):fill);return o};
  const st=d.start||defaultStart();
  buildMonths(st.y,st.m);
  s.n=d.n||3;s.sal=pad(d.sal);s.carry=pad(d.carry||[],0);s.paid=d.paid||{};s.entries=d.entries||[];s.baseEdit=d.baseEdit||{};s.over=d.over||{};
  COLS=d.cols;s.hol=d.hol||[];setHol(s.hol);
  s.mi=cur();
  return true;
}
function saveLocal(){
  const obj=persist(),k=hashOf(obj);
  try{localStorage.setItem(LS_KEY,JSON.stringify(obj))}catch(_){}
  if(k!==sync.lh){sync.lh=k;meta.at=new Date().toISOString();saveMeta();if(sync.uid)paintChip()}
}
function queueSave(){clearTimeout(sync.t);sync.t=setTimeout(saveLocal,400)}
function markSynced(base){meta.base=base;meta.synced=new Date().toISOString();meta.conflict=false;meta.uid=sync.uid;saveMeta()}
async function pushNow(obj){
  const {error}=await sb.from('plans').upsert({user_id:sync.uid,data:obj,updated_at:new Date().toISOString()});
  if(error)throw error;
  markSynced(hashOf(obj));
}
function pullApply(d){
  try{localStorage.setItem(LS_KEY+':bak',localStorage.getItem(LS_KEY)||'')}catch(_){}
  if(!applyData(d))throw new Error('ข้อมูลบนคลาวด์อ่านไม่ได้');
  sync.lh='';saveLocal();render();
  markSynced(hashOf(persist()));
}
const isBlankPlan=o=>!(o.entries&&o.entries.length)&&!Object.keys(o.baseEdit||{}).length&&!Object.keys(o.over||{}).length&&!(o.sal||[]).some(v=>+v>0);
async function smartSync(silent){
  if(!sb||!sync.uid||sync.busy)return;
  sync.busy=true;setAcct('saving');
  let msg='';
  try{
    const {data,error}=await sb.from('plans').select('data,updated_at').eq('user_id',sync.uid).maybeSingle();
    if(error)throw error;
    const obj=persist(),L=hashOf(obj);
    if(!data||!data.data){await pushNow(obj);msg='ส่งข้อมูลขึ้นคลาวด์แล้ว'}
    else{
      const C=hashOf(data.data);
      if(C===L){markSynced(L);msg='ข้อมูลตรงกันอยู่แล้ว'}
      else if(meta.base&&C===meta.base){await pushNow(obj);msg='ส่งการแก้ไขขึ้นคลาวด์แล้ว'}
      else if(meta.base&&L===meta.base){pullApply(data.data);msg='ดึงข้อมูลล่าสุดจากคลาวด์แล้ว'}
      else if(isBlankPlan(obj)){pullApply(data.data);msg='เครื่องนี้ยังว่างอยู่ ดึงข้อมูลจากคลาวด์มาให้แล้ว'}
      else{sync.cloud=data;meta.conflict=true;saveMeta();sync.busy=false;setAcct('conflict');if(!silent)openConflict();return}
    }
  }catch(e){sync.busy=false;setAcct('error',(e&&e.message)||'');return}
  sync.busy=false;setAcct('synced');if(!silent)toast(msg);
}
function autoDue(){
  if(!meta.auto||!sync.uid||sync.busy)return;
  const last=meta.synced?Date.parse(meta.synced):0;
  if(Date.now()-last>20*3600*1000)smartSync(true);
}
function openConflict(){
  const c=sync.cloud;if(!c)return;
  const cnt=d=>(d.entries||[]).length;
  mountSheet('<h3>เลือกข้อมูลที่จะเก็บไว้</h3><p class="note" style="margin:0">ข้อมูลในเครื่องนี้กับบนคลาวด์ไม่เหมือนกัน แอพไม่รวมให้เอง เลือกชุดที่ต้องการ อีกชุดจะถูกเขียนทับ</p>'

/* ---------- app lock (PIN) : stored only on this device ---------- */
const PIN_KEY='debt-planner:pin';
let lockBuf='',lockFails=0,lockUntil=0,hiddenAt=0;
const pinInfo=()=>{try{return JSON.parse(localStorage.getItem(PIN_KEY)||'null')}catch(_){return null}};
async function pinHash(pin,salt){
  try{
    const enc=new TextEncoder(),km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},km,256);
    return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(_){return 'x'+hashOf({pin,salt})}
}
async function pinOk(pin){const i=pinInfo();return !!i&&(await pinHash(pin,i.salt))===i.h}
function paintLock(msg){
  const el=document.getElementById('lock');if(!el)return;
  const n=(pinInfo()||{len:4}).len;
  const dots=Array.from({length:n},(_,i)=>'<i class="'+(i<lockBuf.length?'on':'')+'"></i>').join('');
  const keys=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':'<button type="button" data-act="pk" data-k="'+k+'" aria-label="'+(k==='⌫'?'ลบ':k)+'">'+k+'</button>').join('');
  el.innerHTML='<div class="lk"><div class="lk-art">'+(typeof WALLET!=='undefined'?WALLET:'')+'</div><h2>ใส่ PIN เพื่อเปิดแอพ</h2><div class="lk-dots" id="lk-dots">'+dots+'</div><p class="lk-msg" id="lk-msg">'+(msg||'')+'</p><div class="lk-pad">'+keys+'</div><button type="button" class="lk-forgot" data-act="pinforgot">ลืม PIN</button></div>';
}
function showLock(){
  if(!pinInfo()||document.getElementById('lock'))return;
  closeSheet&&closeSheet(true);
  const el=document.createElement('div');el.id='lock';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  document.body.appendChild(el);lockBuf='';paintLock('');document.body.classList.add('locked');
}
function hideLock(){const el=document.getElementById('lock');if(el)el.remove();document.body.classList.remove('locked');lockBuf='';lockFails=0}
async function lockKey(k){
  const i=pinInfo();if(!i)return hideLock();
  if(Date.now()<lockUntil){paintLock('ลองใหม่ได้ในอีก '+Math.ceil((lockUntil-Date.now())/1000)+' วินาที');return}
  if(k==='⌫')lockBuf=lockBuf.slice(0,-1);
  else if(lockBuf.length<i.len)lockBuf+=k;
  paintLock('');
  if(lockBuf.length===i.len){
    if(await pinOk(lockBuf)){hideLock();return}
    lockFails++;lockBuf='';
    if(lockFails>=5){lockUntil=Date.now()+30000;lockFails=0;paintLock('ใส่ผิดหลายครั้ง รอ 30 วินาที')}
    else paintLock('PIN ไม่ถูกต้อง');
    const d=document.getElementById('lk-dots');if(d){d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400)}
  }
}

  const blob=new Blob([JSON.stringify(persist(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const d=new Date();a.download='debt-planner-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function importFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{const d=JSON.parse(r.result);if(applyData(d)){render();queueSave();toast('นำเข้าข้อมูลแล้ว')}else toast('ไฟล์นี้ไม่ใช่ข้อมูลของแอพนี้')}
    catch(_){toast('อ่านไฟล์ไม่ได้ ลองส่งออกใหม่แล้วนำเข้าอีกครั้ง')}
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
let swallow=false;
let lastErr=0;
window.addEventListener('error',e=>{if(!e.filename&&!e.lineno&&/^Script error\.?$/.test(String(e.message||'')))return;if(Date.now()-lastErr<4000)return;lastErr=Date.now();toast('แอพเจอข้อผิดพลาด: '+String(e.message||'').slice(0,90)+' (แคปหน้านี้ส่งให้ผมได้)')});
window.addEventListener('unhandledrejection',e=>{if(Date.now()-lastErr<4000)return;lastErr=Date.now();toast('แอพเจอข้อผิดพลาด: '+String((e.reason&&e.reason.message)||e.reason||'').slice(0,90))});
document.addEventListener('click',e=>{
  if(swallow){swallow=false;e.preventDefault();e.stopPropagation();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='tab'){s.tab=t.dataset.t;render()}
  else if(a==='salexp'){s.salExp=!s.salExp;render()}
  else if(a==='tv'){s.tv=t.dataset.v;render()}
  else if(a==='sr'){s.sr=+t.dataset.v;render()}
  else if(a==='mv'){s.mi=Math.min(MONTHS.length-1,Math.max(0,s.mi+ +t.dataset.d));render()}
  else if(a==='pay')askPay(+(t.dataset.mi||s.mi),t.dataset.id);
  else if(a==='payok'){const q=s.pc;if(q){const k=q.mi+'-'+q.id;s.paid[k]=!s.paid[k]}s.pc=null;closeSheet(true);render()}
  else if(a==='detail')openDetail(t.dataset.id,+t.dataset.mi);
  else if(a==='cellsheet')openCell(t.dataset.id,+t.dataset.mi);
  else if(a==='cellpay'){const k=s.cellsel.mi+'-'+s.cellsel.col;s.paid[k]=!s.paid[k];repaintCell();queueSave()}
  else if(a==='cellreset'){delete s.over[s.cellsel.col+'-'+s.cellsel.mi];repaintCell();queueSave()}
  else if(a==='cellspl'){const q=s.cellsel;closeSheet();openSpl(q.col,q.mi)}
  else if(a==='celldetail'){const q=s.cellsel;closeSheet();openDetail(q.col,q.mi)}
  else if(a==='dmv'){s.detail.mi=Math.min(MONTHS.length-1,Math.max(0,s.detail.mi+ +t.dataset.d));repaintDetail()}
  else if(a==='delE'){s.entries=s.entries.filter(x=>x.id!==t.dataset.id);repaintDetail();toast('ลบรายการแล้ว ยอดทุกเดือนกลับเป็นเดิม')}
  else if(a==='add'){const keep=s.detail&&s.detail.col;openAdd(t.dataset.id||keep,!!t.dataset.id)}
  else if(a==='newcol')openNewCol();
  else if(a==='editcol')openEditCol(t.dataset.id);
  else if(a==='savecol')saveCol();
  else if(a==='delcol')delCol();
  else if(a==='gosettings'){s.tab='cards';render()}
  else if(a==='mkcol')createCol();
  else if(a==='split')openSplit(t.dataset.id);
  else if(a==='spl')openSpl(t.dataset.id,+t.dataset.mi);
  else if(a==='splok')splOk();
  else if(a==='splline'){const A=cell(s.sp.col,s.sp.mi),used=s.sp.lines.reduce((t,l)=>t+l.amt,0);s.sp.lines.push({amt:Math.max(0,A-used),date:''});repaintSpl()}
  else if(a==='spldel'){s.sp.lines.splice(+t.dataset.i,1);repaintSpl()}
  else if(a==='splundo'){s.entries=s.entries.filter(x=>x.id!==t.dataset.id);closeSheet(true);render();toast('ยกเลิกการแบ่งจ่ายแล้ว')}
  else if(a==='q')setK(+t.dataset.k);
  else if(a==='close')closeSheet();
  else if(a==='apply')apply();
  else if(a==='del'){s.entries=s.entries.filter(x=>x.id!==t.dataset.id);render();toast('ลบรายการแล้ว ยอดทุกเดือนกลับเป็นเดิม')}
  else if(a==='n'){s.n=Math.min(6,Math.max(1,s.n+ +t.dataset.d));s.mi=cur();render()}
  else if(a==='reset'){if(!s.resetArm){s.resetArm=true;render();return}closeSheet(true);s=initial();s.mi=cur();render();toast('ล้างข้อมูลแล้ว')}
  else if(a==='salrange'){const amt=pnum(document.getElementById('sr-amt').value);let f=+document.getElementById('sr-from').value,t=+document.getElementById('sr-to').value;if(t<f){const x=f;f=t;t=x}for(let i=f;i<=t;i++)s.sal[i]=amt;render();toast('ตั้งเงินเดือน ฿'+fmt(amt)+' ตั้งแต่ '+lab(f)+' ถึง '+lab(t)+' แล้ว')}
  else if(a==='acct')openAcct();
  else if(a==='syncnow')smartSync(false);
  else if(a==='chpw')openPw(false);
  else if(a==='refresh'){t.classList.add('spin');try{saveLocal()}catch(_){}
    Promise.race([fetch(location.href.split('#')[0],{cache:'reload'}),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(()=>location.reload())}
  else if(a==='pk')lockKey(t.dataset.k);
  else if(a==='pinforgot')pinForgot();
  else if(a==='pinset')openPin(t.dataset.m);
  else if(a==='pinsave')savePin(t.dataset.m);
  else if(a==='pinlock')showLock();
  else if(a==='savepw')savePw();
  else if(a==='forgot')forgot();
  else if(a==='resolve')openConflict();
  else if(a==='pickl')pickConflict(true);
  else if(a==='pickc')pickConflict(false);
  else if(a==='signout'){closeSheet(true);sb.auth.signOut()}
  else if(a==='showgate'){closeSheet(true);showGate()}
  else if(a==='gsign')gsign();
  else if(a==='mlink')mlink();
  else if(a==='psign')psign(false);
  else if(a==='pup')psign(true);
  else if(a==='export')exportData();
  else if(a==='import'){const f=document.getElementById('imp-file');if(f)f.click()}
  else if(a==='demo')hideGate();
});
/* swipe right on a bill to tick it as paid */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const fg=e.target.closest('.rfg');
  if(!fg||e.target.closest('.chip'))return;
  drag={fg,x:e.clientX,y:e.clientY,dx:0,on:false,id:fg.dataset.id,mi:fg.dataset.mi};
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){drag=null;return}
    if(Math.abs(dx)>10){drag.on=true;drag.fg.classList.add('drag');drag.fg.parentElement.classList.add('swiping');try{drag.fg.setPointerCapture(e.pointerId)}catch(_){}}
  }
  if(drag&&drag.on){
    drag.dx=Math.max(0,Math.min(dx,220));
    drag.fg.style.transform='translateX('+drag.dx+'px)';
    drag.fg.parentElement.classList.toggle('armed',drag.dx>90);
  }
});
function endDrag(){
  if(!drag)return;
  const d=drag;drag=null;
  if(!d.on)return;
  swallow=true;setTimeout(()=>{swallow=false},120);
  d.fg.classList.remove('drag');d.fg.style.transform='';
  d.fg.parentElement.classList.remove('armed');setTimeout(()=>{if(d.fg.parentElement)d.fg.parentElement.classList.remove('swiping')},200);
  if(d.dx>90){setTimeout(()=>askPay(+(d.mi||s.mi),d.id),180)}
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
function onField(e){
  const id=e.target.id||'';
  if(id.indexOf('sp-')===0&&s.sp){
    if(id==='sp-pay')s.sp.pay=pnum(e.target.value);
    if(id==='sp-rate')s.sp.rate=Math.max(0,parseFloat(e.target.value)||0);
    if(id==='sp-pd')s.sp.pd=e.target.value||s.sp.pd;
    if(id.indexOf('sp-la-')===0)s.sp.lines[+id.slice(6)].amt=pnum(e.target.value);
    if(id.indexOf('sp-ld-')===0)s.sp.lines[+id.slice(6)].date=e.target.value;
    if(id==='sp-k'){s.sp.k=+e.target.value;document.getElementById('sp-kv').textContent=s.sp.k}
    const pv=document.getElementById('sp-pv');if(pv)pv.innerHTML=splPv();
    return;
  }
  if(id==='c-amt'&&s.cellsel){
    const {col,mi}=s.cellsel,raw=e.target.value.replace(/[^\d.]/g,''),v=pnum(raw),k=col+'-'+mi;
    if(raw!==''&&v!==origCell(col,mi))s.over[k]=v;else delete s.over[k];
    queueSave();return;
  }
  if(id==='d-base'&&s.detail){
    s.baseEdit[s.detail.col+'-'+s.detail.mi]=pnum(e.target.value);
    document.getElementById('dt-total').textContent='฿'+fmt(cell(s.detail.col,s.detail.mi));
    return;
  }
  if(id==='auto-sync'){meta.auto=e.target.checked;saveMeta();if(meta.auto)autoDue();return}
  if(id.indexOf('salg-')===0){const v=pnum(e.target.value);for(let i=+e.target.dataset.a;i<=+e.target.dataset.b;i++)s.sal[i]=v;queueSave();return}
  if(id.indexOf('sal-')===0||id.indexOf('car-')===0){
    const i=+e.target.dataset.i,v=pnum(e.target.value);
    if(id.indexOf('sal-')===0)s.sal[i]=v;else s.carry[i]=v;
    queueSave();return;
  }
  if(id==='hol-in'){s.hol=e.target.value.split(/\s+/).map(x=>x.trim()).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));setHol(s.hol);queueSave();return}
  if(id==='nc-type'){const v=e.target.value,on=v!=='other';document.getElementById('nc-cutw').style.display=on?'':'none';document.getElementById('nc-ratew').style.display=on?'':'none';if(on)document.getElementById('nc-rate').value=v==='cash'?25:v==='xcard'?0:16;return}
  if(id==='ec-pm'||id==='ec-pf'||id==='ec-pt'){planNote();return}
  if(id==='ec-type'){document.getElementById('ec-rate').value=e.target.value==='cash'?25:e.target.value==='other'?0:16;return}
  if(['f-name','f-cat','f-catx','f-amt','f-col','f-from','f-to','f-int','f-iu','f-z','f-zm','f-tx','k'].includes(id)||id.indexOf('pv-in-')===0)readForm(e);
}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{if(e.target.id==='imp-file'&&e.target.files[0]){importFile(e.target.files[0]);e.target.value='';return}
  if(['f-col','f-from','f-to','f-iu','f-du','f-z','f-tx','sp-pd','nc-type','ec-type','ec-pf','ec-pt'].includes(e.target.id))onField(e)});
boot();
</script>
